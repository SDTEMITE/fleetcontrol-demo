<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetControl — Flota y Maestros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="fc-app text-slate-800 antialiased">
    <div class="flex h-screen overflow-hidden">
        <aside id="fc-sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between"></aside>
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="fc-header h-16 border-b bg-white flex items-center justify-between px-6 sticky top-0 z-10">
                <h2 class="text-xl font-bold">Gestión de Flota, Choferes y Clientes</h2>
                <div class="flex gap-2">
                    <button data-open="modal-truck" class="bg-emerald-600 text-white text-sm px-3 py-2 rounded-lg font-medium">+ Vehículo</button>
                    <button data-open="modal-drv" class="border text-sm px-3 py-2 rounded-lg">+ Chofer</button>
                    <button data-open="modal-cli" class="border text-sm px-3 py-2 rounded-lg">+ Cliente</button>
                </div>
            </header>
            <div class="p-6 space-y-6">
                <div id="alerts" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
                <div class="flex gap-2">
                    <button data-tab="trucks" class="tab px-3 py-1.5 text-sm rounded-lg bg-slate-900 text-white">Camiones</button>
                    <button data-tab="drivers" class="tab px-3 py-1.5 text-sm rounded-lg border">Choferes</button>
                    <button data-tab="clients" class="tab px-3 py-1.5 text-sm rounded-lg border">Clientes</button>
                </div>
                <div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>
        </main>
    </div>

    <div id="modal-truck" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
        <form id="form-truck" class="bg-white rounded-2xl w-full max-w-lg p-6 grid grid-cols-2 gap-3">
            <h3 class="col-span-2 font-bold">Registrar vehículo</h3>
            <input name="plate" required placeholder="Patente" class="border rounded-lg px-3 py-2 text-sm">
            <input name="brand" required placeholder="Marca" class="border rounded-lg px-3 py-2 text-sm">
            <input name="model" required placeholder="Modelo" class="border rounded-lg px-3 py-2 text-sm">
            <input name="year" type="number" value="2024" class="border rounded-lg px-3 py-2 text-sm">
            <input name="gpsId" placeholder="ID Bermann" class="border rounded-lg px-3 py-2 text-sm">
            <input name="revisionExpiry" type="date" required value="2027-01-15" class="border rounded-lg px-3 py-2 text-sm">
            <div class="col-span-2 flex justify-end gap-2"><button type="button" data-close="modal-truck" class="px-3 py-2 border rounded-lg text-sm">Cancelar</button><button class="px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm">Guardar</button></div>
        </form>
    </div>
    <div id="modal-drv" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
        <form id="form-drv" class="bg-white rounded-2xl w-full max-w-lg p-6 grid grid-cols-2 gap-3">
            <h3 class="col-span-2 font-bold">Registrar chofer</h3>
            <input name="name" required placeholder="Nombre" class="border rounded-lg px-3 py-2 text-sm">
            <input name="rut" required placeholder="RUT" class="border rounded-lg px-3 py-2 text-sm">
            <select name="license" class="border rounded-lg px-3 py-2 text-sm"><option>A5</option><option>A4</option><option>A3</option></select>
            <input name="licenseExpiry" type="date" required value="2027-06-01" class="border rounded-lg px-3 py-2 text-sm">
            <input name="phone" placeholder="Teléfono" class="border rounded-lg px-3 py-2 text-sm">
            <select name="truckId" class="border rounded-lg px-3 py-2 text-sm"></select>
            <div class="col-span-2 flex justify-end gap-2"><button type="button" data-close="modal-drv" class="px-3 py-2 border rounded-lg text-sm">Cancelar</button><button class="px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm">Guardar</button></div>
        </form>
    </div>
    <div id="modal-cli" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
        <form id="form-cli" class="bg-white rounded-2xl w-full max-w-lg p-6 grid grid-cols-2 gap-3">
            <h3 class="col-span-2 font-bold">Registrar cliente</h3>
            <input name="name" required placeholder="Razón social" class="col-span-2 border rounded-lg px-3 py-2 text-sm">
            <input name="rut" required placeholder="RUT" class="border rounded-lg px-3 py-2 text-sm">
            <input name="contact" required placeholder="Contacto" class="border rounded-lg px-3 py-2 text-sm">
            <input name="phone" placeholder="Teléfono" class="border rounded-lg px-3 py-2 text-sm">
            <input name="email" type="email" placeholder="Email" class="border rounded-lg px-3 py-2 text-sm">
            <div class="col-span-2 flex justify-end gap-2"><button type="button" data-close="modal-cli" class="px-3 py-2 border rounded-lg text-sm">Cancelar</button><button class="px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm">Guardar</button></div>
        </form>
    </div>

    <script src="js/app.js"></script>
    <script>
        const session = FleetApp.requireAuth(["admin", "operaciones"]);
        if (!session) throw new Error("auth");
        FleetApp.renderSidebar("flota");
        FleetApp.bindModalDismiss();
        let tab = "trucks";
        document.querySelectorAll("[data-open]").forEach(function (b) {
            b.addEventListener("click", function () { FleetApp.openModal(b.getAttribute("data-open")); });
        });
        document.querySelectorAll(".tab").forEach(function (b) {
            b.addEventListener("click", function () {
                tab = b.getAttribute("data-tab");
                document.querySelectorAll(".tab").forEach(function (x) { x.className = "tab px-3 py-1.5 text-sm rounded-lg border"; });
                b.className = "tab px-3 py-1.5 text-sm rounded-lg bg-slate-900 text-white";
                render();
            });
        });
        function formObj(form) { const o = {}; new FormData(form).forEach(function (v, k) { o[k] = v; }); return o; }
        document.getElementById("form-truck").addEventListener("submit", function (e) { e.preventDefault(); FleetApp.addTruck(formObj(e.target)); FleetApp.closeModal("modal-truck"); FleetApp.toast("Vehículo registrado", "ok"); render(); });
        document.getElementById("form-drv").addEventListener("submit", function (e) { e.preventDefault(); FleetApp.addDriver(formObj(e.target)); FleetApp.closeModal("modal-drv"); FleetApp.toast("Chofer registrado", "ok"); render(); });
        document.getElementById("form-cli").addEventListener("submit", function (e) { e.preventDefault(); FleetApp.addClient(formObj(e.target)); FleetApp.closeModal("modal-cli"); FleetApp.toast("Cliente registrado", "ok"); render(); });

        function render() {
            FleetApp.icons();
            const db = FleetApp.load();
            FleetApp.fillSelect(document.querySelector('#form-drv [name="truckId"]'), FleetApp.optionsFrom(db.trucks, "id", function (t) { return t.plate; }), "Sin asignar");
            const lic = db.drivers.filter(function (d) { return FleetApp.daysUntil(d.licenseExpiry) < 0; });
            const soonLic = db.drivers.filter(function (d) { const n = FleetApp.daysUntil(d.licenseExpiry); return n >= 0 && n <= 45; });
            const rev = db.trucks.filter(function (t) { return FleetApp.daysUntil(t.revisionExpiry) <= 30; });
            document.getElementById("alerts").innerHTML =
                alertCard("Licencias vencidas", lic.length, lic.map(function (d) { return d.name; }).join(", ") || "Sin alertas", lic.length ? "text-red-700" : "text-emerald-700") +
                alertCard("Licencias por vencer", soonLic.length, soonLic.map(function (d) { return d.name; }).join(", ") || "Sin alertas", soonLic.length ? "text-amber-700" : "text-emerald-700") +
                alertCard("Revisión técnica ≤ 30 días", rev.length, rev.map(function (t) { return t.plate; }).join(", ") || "Al día", rev.length ? "text-amber-700" : "text-emerald-700");
            const grid = document.getElementById("grid");
            if (tab === "trucks") {
                grid.innerHTML = db.trucks.map(function (t) {
                    const drv = db.drivers.find(function (d) { return d.truckId === t.id; });
                    const days = FleetApp.daysUntil(t.revisionExpiry);
                    const bad = days <= 30;
                    const expired = days < 0;
                    const pct = Math.max(4, Math.min(100, Math.round((Math.max(days, 0) / 180) * 100)));
                    const bar = expired ? "bg-red-500" : bad ? "bg-amber-500" : "bg-emerald-500";
                    const rtLabel = expired ? "Revisión técnica vencida" : (days === 0 ? "Revisión técnica hoy" : "Revisión técnica en " + days + " días");
                    const initials = drv ? drv.name.split(" ").map(function (p) { return p[0]; }).slice(0, 2).join("") : "?";
                    return '<div class="bg-white border rounded-xl p-5 space-y-4 ' + (bad ? "border-amber-300" : "") + '">' +
                        '<div class="flex items-start justify-between gap-3"><div><p class="text-lg font-bold">' + t.plate + '</p><p class="text-xs text-slate-500">' + t.brand + " " + t.model + " (" + t.year + ')</p></div>' +
                        '<div class="flex items-center gap-2"><span class="text-xs font-bold px-2 py-1 rounded-full ' + (bad ? "bg-amber-100 text-amber-800" : "bg-emerald-100 text-emerald-800") + '">' + (bad ? "Mantención" : "Operativo") + '</span>' +
                        '<div class="w-11 h-11 rounded-full bg-slate-900 text-emerald-300 flex items-center justify-center text-xs font-extrabold ring-2 ring-white shadow" title="' + (drv ? drv.name : "Sin chofer") + '">' + initials + "</div></div></div>" +
                        '<div><div class="flex justify-between text-[11px] mb-1"><span class="font-semibold text-slate-600">' + rtLabel + '</span><span class="text-slate-400">' + t.revisionExpiry + "</span></div>" +
                        '<div class="h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full ' + bar + '" style="width:' + pct + '%"></div></div></div>' +
                        '<div class="text-xs space-y-1"><div class="flex justify-between"><span class="text-slate-500">Chofer</span><span class="font-bold">' + (drv ? drv.name : "Sin asignar") + '</span></div><div class="flex justify-between"><span class="text-slate-500">GPS Bermann</span><span class="font-mono">#' + t.gpsId + "</span></div></div></div>";
                }).join("");
            } else if (tab === "drivers") {
                grid.innerHTML = db.drivers.map(function (d) {
                    const t = db.trucks.find(function (x) { return x.id === d.truckId; });
                    const days = FleetApp.daysUntil(d.licenseExpiry);
                    const expired = days < 0;
                    return '<div class="bg-white border rounded-xl p-5 space-y-3 ' + (expired ? "border-red-300 bg-red-50/20" : "") + '"><div class="flex justify-between"><div><p class="font-bold">' + d.name + '</p><p class="text-xs text-slate-500">' + d.rut + '</p></div><span class="text-xs font-bold px-2 py-1 rounded-full ' + (expired ? "bg-red-100 text-red-800" : "bg-emerald-100 text-emerald-800") + '">' + (expired ? "Licencia vencida" : "Vigente") + '</span></div>' +
                        '<div class="text-xs space-y-1"><div class="flex justify-between"><span class="text-slate-500">Licencia</span><span>' + d.license + " · " + d.licenseExpiry + '</span></div><div class="flex justify-between"><span class="text-slate-500">Camión</span><span class="font-bold">' + (t ? t.plate : "—") + '</span></div><div class="flex justify-between"><span class="text-slate-500">Teléfono</span><span>' + d.phone + '</span></div></div></div>';
                }).join("");
            } else {
                grid.innerHTML = db.clients.map(function (c) {
                    const n = db.ots.filter(function (o) { return o.clientId === c.id; }).length;
                    return '<div class="bg-white border rounded-xl p-5 space-y-2"><p class="font-bold">' + c.name + '</p><p class="text-xs text-slate-500">RUT ' + c.rut + '</p><p class="text-xs">' + c.contact + ' · ' + c.phone + '</p><p class="text-xs text-slate-400">' + n + ' OTs en el sistema</p></div>';
                }).join("");
            }
        }
        function alertCard(t, n, s, color) {
            return '<div class="bg-white border rounded-xl p-4"><p class="text-xs uppercase text-slate-500 font-semibold">' + t + '</p><p class="text-2xl font-bold ' + color + '">' + n + '</p><p class="text-xs text-slate-500 mt-1">' + s + '</p></div>';
        }
        render();
    </script>
</body>
</html>
