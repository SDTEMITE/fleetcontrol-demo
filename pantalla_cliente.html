<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetControl — Portal Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="fc-app text-slate-800 antialiased">
    <div class="flex h-screen overflow-hidden">
        <aside id="fc-sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between"></aside>
        <main class="flex-1 overflow-y-auto">
            <header class="fc-header h-16 border-b bg-white flex items-center justify-between px-6">
                <h2 class="text-xl font-bold">Mis embarques</h2>
                <div class="flex items-center gap-3">
                    <p id="who" class="text-sm text-slate-500"></p>
                    <button type="button" id="to-mobile" class="text-xs font-semibold text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg">Abrir app móvil</button>
                </div>
            </header>
            <div class="p-6 space-y-4">
                <p class="text-sm text-slate-500">Solo ves las OT de tu empresa. El tracking público no muestra el resto de la flota.</p>
                <div id="list" class="space-y-3"></div>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
    <script>
        const session = FleetApp.requireAuth(["cliente", "admin"]);
        if (!session) throw new Error("auth");
        FleetApp.renderSidebar("cli");
        const toMobile = document.getElementById("to-mobile");
        if (toMobile) toMobile.addEventListener("click", function () { FleetApp.switchMode("mobile"); });
        const db = FleetApp.load();
        const clientId = session.clientId || "c1";
        const client = db.clients.find(function (c) { return c.id === clientId; });
        document.getElementById("who").textContent = client ? client.name + " · " + client.rut : "";
        const ots = db.ots.filter(function (o) { return o.clientId === clientId; }).map(function (o) { return FleetApp.hydrateOt(o, db); });
        document.getElementById("list").innerHTML = ots.map(function (o) {
            const st = FleetApp.statusMeta(o.status);
            return '<div class="bg-white border rounded-xl p-5 flex flex-wrap justify-between gap-3 items-center">' +
                '<div><p class="font-bold">' + o.id + ' · ' + o.container + '</p><p class="text-sm text-slate-500">' + o.origin + ' → ' + o.destination + '</p><p class="text-xs text-slate-400 mt-1">Sello ' + o.seal + ' · POD ' + FleetApp.podMeta(o.pod).label + '</p></div>' +
                '<div class="flex items-center gap-2"><span class="text-xs font-semibold px-2.5 py-1 rounded-full border ' + st.cls + '">' + st.label + '</span>' +
                '<a class="text-xs font-bold text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg" href="' + FleetApp.trackingUrl(o) + '" target="_blank">Ver tracking</a></div></div>';
        }).join("") || '<p class="text-slate-400">Sin embarques</p>';
        FleetApp.icons();
    </script>
</body>
</html>
