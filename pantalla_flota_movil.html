<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetControl Móvil — Flota</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="fc-mobile-page">
    <div class="fc-mobile-app">
        <header id="fc-m-header"></header>
        <div class="fc-m-body space-y-3">
            <div id="alerts" class="grid grid-cols-3 gap-2"></div>
            <div class="flex gap-2">
                <button data-tab="trucks" class="tab flex-1 text-xs py-2 rounded-xl bg-slate-900 text-white">Camiones</button>
                <button data-tab="drivers" class="tab flex-1 text-xs py-2 rounded-xl border">Choferes</button>
                <button data-tab="clients" class="tab flex-1 text-xs py-2 rounded-xl border">Clientes</button>
            </div>
            <button id="btn-add" class="w-full bg-emerald-600 text-white text-xs font-bold py-2.5 rounded-xl">Registrar</button>
            <div id="grid" class="space-y-2"></div>
        </div>
        <nav id="fc-m-nav"></nav>
    </div>
    <div id="modal-add" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-end justify-center p-3">
        <form id="form-add" class="bg-white rounded-2xl w-full max-w-md p-4 space-y-2"></form>
    </div>
    <script src="js/app.js"></script>
    <script>
        const session = FleetApp.requireAuth(["admin", "operaciones"]);
        if (!session) throw new Error("auth");
        FleetApp.renderMobileChrome("flota-m", "Flota y maestros");
        let tab = "trucks";
        document.querySelectorAll(".tab").forEach(function (b) {
            b.onclick = function () {
                tab = b.getAttribute("data-tab");
                document.querySelectorAll(".tab").forEach(function (x) { x.className = "tab flex-1 text-xs py-2 rounded-xl border"; });
                b.className = "tab flex-1 text-xs py-2 rounded-xl bg-slate-900 text-white";
                render();
            };
        });
        document.getElementById("btn-add").onclick = function () {
            const form = document.getElementById("form-add");
            if (tab === "trucks") form.innerHTML = '<h3 class="font-bold">Vehículo</h3><input name="plate" required placeholder="Patente" class="w-full border rounded-lg px-3 py-2 text-sm"><input name="brand" required placeholder="Marca" class="w-full border rounded-lg px-3 py-2 text-sm"><input name="model" required placeholder="Modelo" class="w-full border rounded-lg px-3 py-2 text-sm"><input name="year" value="2024" class="w-full border rounded-lg px-3 py-2 text-sm"><input name="revisionExpiry" type="date" required value="2027-01-15" class="w-full border rounded-lg px-3 py-2 text-sm"><div class="flex gap-2"><button type="button" data-close="modal-add" class="flex-1 border rounded-lg py-2 text-sm">Cancelar</button><button class="flex-1 bg-emerald-600 text-white rounded-lg py-2 text-sm">Guardar</button></div>';
            if (tab === "drivers") form.innerHTML = '<h3 class="font-bold">Chofer</h3><input name="name" required placeholder="Nombre" class="w-full border rounded-lg px-3 py-2 text-sm"><input name="rut" required placeholder="RUT" class="w-full border rounded-lg px-3 py-2 text-sm"><select name="license" class="w-full border rounded-lg px-3 py-2 text-sm"><option>A5</option><option>A4</option></select><input name="licenseExpiry" type="date" required value="2027-06-01" class="w-full border rounded-lg px-3 py-2 text-sm"><input name="phone" placeholder="Teléfono" class="w-full border rounded-lg px-3 py-2 text-sm"><div class="flex gap-2"><button type="button" data-close="modal-add" class="flex-1 border rounded-lg py-2 text-sm">Cancelar</button><button class="flex-1 bg-emerald-600 text-white rounded-lg py-2 text-sm">Guardar</button></div>';
            if (tab === "clients") form.innerHTML = '<h3 class="font-bold">Cliente</h3><input name="name" required placeholder="Razón social" class="w-full border rounded-lg px-3 py-2 text-sm"><input name="rut" required placeholder="RUT" class="w-full border rounded-lg px-3 py-2 text-sm"><input name="contact" required placeholder="Contacto" class="w-full border rounded-lg px-3 py-2 text-sm"><input name="phone" placeholder="Teléfono" class="w-full border rounded-lg px-3 py-2 text-sm"><input name="email" placeholder="Email" class="w-full border rounded-lg px-3 py-2 text-sm"><div class="flex gap-2"><button type="button" data-close="modal-add" class="flex-1 border rounded-lg py-2 text-sm">Cancelar</button><button class="flex-1 bg-emerald-600 text-white rounded-lg py-2 text-sm">Guardar</button></div>';
            FleetApp.bindModalDismiss();
            FleetApp.openModal("modal-add");
        };
        document.getElementById("form-add").onsubmit = function (e) {
            e.preventDefault();
            const o = {}; new FormData(e.target).forEach(function (v, k) { o[k] = v; });
            if (tab === "trucks") FleetApp.addTruck(o);
            if (tab === "drivers") FleetApp.addDriver(o);
            if (tab === "clients") FleetApp.addClient(o);
            FleetApp.closeModal("modal-add");
            FleetApp.toast("Registrado", "ok");
            render();
        };
        function render() {
            const db = FleetApp.load();
            const lic = db.drivers.filter(function (d) { return FleetApp.daysUntil(d.licenseExpiry) < 0; }).length;
            const soon = db.drivers.filter(function (d) { const n = FleetApp.daysUntil(d.licenseExpiry); return n >= 0 && n <= 45; }).length;
            const rev = db.trucks.filter(function (t) { return FleetApp.daysUntil(t.revisionExpiry) <= 30; }).length;
            document.getElementById("alerts").innerHTML =
                '<div class="bg-white border rounded-xl p-2 text-center"><p class="font-extrabold">' + lic + '</p><p class="text-[9px] text-slate-500">Lic. vencida</p></div>' +
                '<div class="bg-white border rounded-xl p-2 text-center"><p class="font-extrabold">' + soon + '</p><p class="text-[9px] text-slate-500">Por vencer</p></div>' +
                '<div class="bg-white border rounded-xl p-2 text-center"><p class="font-extrabold">' + rev + '</p><p class="text-[9px] text-slate-500">Rev. técnica</p></div>';
            const grid = document.getElementById("grid");
            if (tab === "trucks") grid.innerHTML = db.trucks.map(function (t) { return '<div class="bg-white border rounded-2xl p-3"><p class="font-bold">' + t.plate + '</p><p class="text-xs text-slate-500">' + t.brand + " " + t.model + '</p><p class="text-[11px]">GPS #' + t.gpsId + " · RT " + t.revisionExpiry + "</p></div>"; }).join("");
            else if (tab === "drivers") grid.innerHTML = db.drivers.map(function (d) { return '<div class="bg-white border rounded-2xl p-3"><p class="font-bold">' + d.name + '</p><p class="text-xs">' + d.license + " · " + d.licenseExpiry + '</p></div>'; }).join("");
            else grid.innerHTML = db.clients.map(function (c) { return '<div class="bg-white border rounded-2xl p-3"><p class="font-bold">' + c.name + '</p><p class="text-xs">' + c.rut + " · " + c.contact + "</p></div>"; }).join("");
        }
        render();
    </script>
</body>
</html>
