<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetControl — App Chofer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-[#070b14] flex items-center justify-center min-h-screen p-4">
    <div class="fc-phone-shell w-full max-w-sm bg-slate-950 rounded-[40px] p-3 border border-white/10">
        <div class="fc-phone-screen text-slate-800 rounded-[30px] overflow-hidden flex flex-col h-[720px] relative">
            <div class="bg-slate-900 text-white px-6 py-2 flex justify-between items-center text-xs">
                <span class="font-bold">09:41</span>
                <div class="w-16 h-3 bg-slate-800 rounded-full"></div>
                <div class="flex items-center gap-1.5"><i data-lucide="wifi" class="w-3.5 h-3.5"></i><i data-lucide="battery" class="w-3.5 h-3.5"></i></div>
            </div>
            <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="av" class="w-9 h-9 rounded-full bg-emerald-500 text-slate-950 font-bold flex items-center justify-center text-sm">CM</div>
                    <div>
                        <h2 id="drv-name" class="font-bold text-sm leading-tight">Chofer</h2>
                        <p id="drv-truck" class="text-[10px] text-emerald-400 font-medium"></p>
                    </div>
                </div>
                <button type="button" id="to-web" class="text-[10px] text-emerald-300 border border-emerald-400/30 px-2 py-1 rounded-lg">Versión web</button>
            </div>
            <div id="view" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            <div class="bg-white border-t border-slate-100 py-2 px-6 flex justify-around text-slate-400">
                <button data-tab="viaje" class="tab text-emerald-600 flex flex-col items-center"><i data-lucide="truck" class="w-5 h-5"></i><span class="text-[9px] font-bold">Viaje</span></button>
                <button data-tab="hist" class="tab flex flex-col items-center"><i data-lucide="history" class="w-5 h-5"></i><span class="text-[9px]">Historial</span></button>
                <button data-tab="perfil" class="tab flex flex-col items-center"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[9px]">Perfil</span></button>
            </div>
        </div>
    </div>
    <a href="index.html" class="fixed top-4 left-4 text-xs text-slate-400 hover:text-white">← Salir</a>
    <script src="js/app.js"></script>
    <script>
        const session = FleetApp.requireAuth(["chofer", "admin"]);
        if (!session) throw new Error("auth");
        const db0 = FleetApp.load();
        const driverId = session.driverId || "d1";
        const driver = db0.drivers.find(function (d) { return d.id === driverId; }) || db0.drivers[0];
        const truck = db0.trucks.find(function (t) { return t.id === driver.truckId; }) || {};
        document.getElementById("av").textContent = session.initials;
        document.getElementById("drv-name").textContent = driver.name;
        document.getElementById("drv-truck").textContent = "Camión: " + (truck.plate || "—");
        const toWeb = document.getElementById("to-web");
        if (toWeb) toWeb.addEventListener("click", function () { FleetApp.switchMode("web"); });
        let tab = "viaje";
        let currentId = null;

        document.querySelectorAll(".tab").forEach(function (b) {
            b.addEventListener("click", function () {
                tab = b.getAttribute("data-tab");
                document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("text-emerald-600"); });
                b.classList.add("text-emerald-600");
                render();
            });
        });
        function mine() {
            return FleetApp.load().ots.filter(function (o) { return o.driverId === driver.id && o.status !== "anulada"; }).map(function (o) { return FleetApp.hydrateOt(o); });
        }

        function render() {
            const ots = mine();
            const active = ots.filter(function (o) { return o.status === "programada" || o.status === "transito" || o.status === "entregado"; });
            const bellDot = document.getElementById("bell-dot");
            if (bellDot) bellDot.classList.toggle("hidden", !active.some(function (o) { return o.pod !== "ok"; }));
            if (tab === "hist") {
                document.getElementById("view").innerHTML = ots.filter(function (o) { return o.status === "cerrada"; }).map(cardMini).join("") || '<p class="text-sm text-slate-400">Sin historial</p>';
                FleetApp.icons();
                return;
            }
            if (tab === "perfil") {
                document.getElementById("view").innerHTML =
                    '<div class="bg-white p-4 rounded-2xl border space-y-2 text-sm"><p class="font-bold">' + driver.name + '</p><p>RUT ' + driver.rut + '</p><p>Licencia ' + driver.license + ' vence ' + driver.licenseExpiry + '</p><p>' + driver.phone + '</p><button id="logout-m" class="mt-3 w-full border rounded-lg py-2 text-xs">Cerrar sesión</button></div>';
                document.getElementById("logout-m").addEventListener("click", FleetApp.logout);
                return;
            }
            const ot = (currentId && ots.find(function (o) { return o.id === currentId; })) || active[0] || ots[0];
            if (!ot) { document.getElementById("view").innerHTML = '<p class="text-sm text-slate-400">Sin viajes asignados</p>'; return; }
            currentId = ot.id;
            const loaded = ot.docs.filter(function (d) { return d.status !== "pendiente" && d.status !== "rechazado"; }).length;
            document.getElementById("view").innerHTML =
                (active.length > 1 ? '<select id="pick" class="w-full text-xs border rounded-lg px-2 py-2">' + active.map(function (o) { return '<option value="' + o.id + '"' + (o.id === ot.id ? " selected" : "") + '>' + o.id + " · " + o.clientName + "</option>"; }).join("") + "</select>" : "") +
                '<div class="bg-white p-4 rounded-2xl border space-y-3"><div class="flex justify-between"><span class="bg-emerald-100 text-emerald-800 font-bold text-xs px-2.5 py-1 rounded-md">' + ot.id + " " + FleetApp.statusMeta(ot.status).label.toUpperCase() + '</span><span class="text-xs text-slate-400">' + ot.date + '</span></div>' +
                '<h3 class="font-bold">' + ot.clientName + '</h3><p class="text-xs">Contenedor <span class="font-mono font-bold">' + ot.container + '</span> · Sello ' + ot.seal + '</p>' +
                '<div class="text-xs space-y-2"><div class="flex gap-2"><i data-lucide="circle-dot" class="w-4 h-4 text-emerald-600"></i><div><p class="text-[10px] uppercase text-slate-400">Origen</p><p class="font-semibold">' + ot.origin + '</p></div></div>' +
                '<div class="flex gap-2"><i data-lucide="map-pin" class="w-4 h-4 text-red-500"></i><div><p class="text-[10px] uppercase text-slate-400">Destino</p><p class="font-semibold">' + ot.destination + '</p></div></div></div></div>' +
                '<div class="bg-white p-4 rounded-2xl border space-y-3"><div class="flex justify-between"><h4 class="font-bold text-xs uppercase">Documentos</h4><span class="text-[11px] bg-amber-50 text-amber-700 px-2 py-0.5 rounded font-bold">' + loaded + " / " + ot.docs.length + '</span></div>' +
                ot.docs.map(docBlock).join("") + "</div>" +
                (ot.status === "programada" ? '<button id="go-tr" class="w-full bg-blue-600 text-white text-xs font-bold py-3 rounded-xl">Iniciar viaje (En tránsito)</button>' : "") +
                (ot.status === "transito" || ot.status === "entregado" ? '<button id="go-ent" class="w-full bg-slate-900 text-white text-xs font-bold py-3 rounded-xl">Confirmar Entrega Completa</button>' : "");
            const pick = document.getElementById("pick");
            if (pick) pick.addEventListener("change", function () { currentId = pick.value; render(); });
            bindDocs(ot);
            const g1 = document.getElementById("go-tr");
            if (g1) g1.addEventListener("click", function () { act(ot.id, "transito"); });
            const g2 = document.getElementById("go-ent");
            if (g2) g2.addEventListener("click", function () { act(ot.id, "entregado"); });
            FleetApp.icons();
        }

        function docBlock(d) {
            const meta = FleetApp.docStatusMeta(d.status);
            if (d.status === "cargado" || d.status === "aprobado") {
                return '<div class="border rounded-xl p-3 flex justify-between items-center"><div><p class="font-bold text-xs">' + d.label + '</p><p class="text-[10px] text-slate-400">' + (d.fileName || "archivo") + '</p></div><span class="text-[10px] font-bold px-2 py-1 rounded ' + meta.cls + '">' + meta.label + '</span></div>';
            }
            return '<div class="border-2 border-dashed border-emerald-300 bg-emerald-50/30 rounded-xl p-3 text-center space-y-2">' +
                '<p class="font-bold text-xs">' + d.label + (d.required ? " *" : "") + '</p>' +
                (d.status === "rechazado" ? '<p class="text-[10px] text-red-600">' + d.rejectReason + "</p>" : "") +
                '<label class="block w-full bg-emerald-600 text-white font-semibold text-xs py-2.5 rounded-lg cursor-pointer">Tomar / subir foto<input type="file" accept="image/*,.pdf" data-doc="' + d.type + '" class="hidden"></label></div>';
        }

        function bindDocs(ot) {
            document.querySelectorAll("input[data-doc]").forEach(function (inp) {
                inp.addEventListener("change", function () {
                    const file = inp.files[0];
                    FleetApp.readFilePreview(file, function (preview) {
                        const r = FleetApp.uploadDoc(ot.id, inp.getAttribute("data-doc"), { fileName: file ? file.name : "foto.jpg", preview: preview, receiver: "Recepción en destino" });
                        if (!r.ok) { FleetApp.toast(r.error, "err"); return; }
                        FleetApp.toast("Documento cargado", "ok");
                        render();
                    });
                });
            });
        }

        function act(id, status) {
            const r = FleetApp.setOtStatus(id, status);
            if (!r.ok) { FleetApp.toast(r.error, "err"); return; }
            FleetApp.toast(status === "entregado" ? "Entrega enviada a validación POD" : "Viaje iniciado", "ok");
            render();
        }

        function cardMini(o) {
            return '<div class="bg-white p-3 rounded-xl border text-xs"><p class="font-bold">' + o.id + '</p><p>' + o.clientName + '</p><p class="text-slate-400">' + o.date + '</p></div>';
        }
        render();
    </script>
</body>
</html>
